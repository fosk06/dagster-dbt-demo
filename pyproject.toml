[project]
name = "jaffle_platform"
requires-python = ">=3.11,<3.13"
version = "0.1.0"
dependencies = [
    "dagster>=1.11.5",
    "dagster-dbt>=0.27.5",
    "dagster-dlt>=0.27.5",
    "dagster-postgres>=0.27.5",
    "dagster-sling>=0.27.5",
    "dbt-postgres>=1.9.0",
    "duckdb>=1.3.1",
    "jafgen>=0.4.14",
    "nltk>=3.8.1",
    "pandas>=2.2.1",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.41",
    "anyio>=4.9.0",
    "vulture>=2.14",
    "fastmcp>=1.0",
    "dg-sqlmesh>=1.4.0",
]

[project.optional-dependencies]
dbt = [
    "dagster>=1.11.5",
    "dlt>=1.13.0",
    "duckdb>=1.3.1",
    "postgres>=4.0",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli[local]",
    "sqlmesh[web]>=0.209.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "jaffle_platform"
registry_modules = [
    "jaffle_platform.components.*",
]

[tool.dg.cli]

[tool.uv.sources]


