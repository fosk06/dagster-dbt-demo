type: dg_sqlmesh.SQLMeshProjectComponent

attributes:
  project: "{{ project_root }}/sqlmesh_project"
  gateway: "postgres"
  environment: "prod"
  concurrency_limit: 1
  name: "sqlmesh_multi_asset"
  group_name: "sqlmesh"
  op_tags:
    team: "data"
    env: "prod"
  retry_policy:
    max_retries: 1
    delay: 30.0
    backoff: "exponential"
  schedule_name: "sqlmesh_adaptive_schedule"
  enable_schedule: true
  external_asset_mapping: "target/main/{node.name}"
# Note: La configuration external_asset_mapping remplace le translator personnalisé
# en permettant de définir le mapping via un template Jinja2.
